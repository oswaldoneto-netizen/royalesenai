<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Royale Senai</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c1a22; color: #e9f3f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    /* Layout Global & Telas */
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    .overlay-screen { position: absolute; inset: 0; background: linear-gradient(180deg, #0c1a22 0%, #17424f 60%, #ff7a4d 140%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 16px; overflow-y: auto; }
    
    /* Caixa de Autenticação Modificada */
    .auth-box { background: #0c1a22cc; border: 2px solid #5ec8ff55; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); text-align: center; }
    .auth-box h1 { font-family: Impact, sans-serif; font-size: 32px; letter-spacing: 1px; color: #58a6ff; margin-bottom: 6px; }
    .auth-box p { font-size: 13px; color: #9fd9ef; margin-bottom: 18px; }
    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 11px; color: #9fd9ef; margin-bottom: 4px; font-weight: bold; }
    .input-group input { width: 100%; padding: 12px; background: #08131a; border: 2px solid #5ec8ff; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
    .btn-group { display: flex; gap: 10px; margin-top: 16px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-family: Impact, sans-serif; font-size: 16px; letter-spacing: 1px; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.96); }
    .btn-primary { background: #ff5a4d; color: #fff; }
    .btn-secondary { background: #2b8a4a; color: #fff; }
    #ast { margin-top: 12px; font-size: 13px; min-height: 18px; color: #ffb3a8; }
    
    /* Lobby do Jogo */
    #lobby { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; overflow-y: auto; padding: 12px 0; gap: 10px; background: linear-gradient(180deg,#0c1a22 0%,#17424f 60%,#ff7a4d 140%); }
    #lbar { display: flex; align-items: center; gap: 12px; width: min(860px,94vw); margin-top: 4px; }
    #xp { flex: 1; height: 10px; background: #08131a; border-radius: 6px; overflow: hidden; }
    #xpb { height: 100%; background: #5ec8ff; width: 0; }
    #lmain { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; width: min(860px,96vw); }
    #pvw { position: relative; width: 300px; height: 380px; border-radius: 16px; background: radial-gradient(circle at 50% 35%,#2a6f86,#0c1a22); border: 2px solid #5ec8ff55; overflow: hidden; }
    #pv { width: 100%; height: 100%; display: block; }
    #lside { display: flex; flex-direction: column; gap: 12px; width: min(340px,92vw); }
    .card { background: #0c1a22cc; border: 2px solid #5ec8ff55; border-radius: 14px; padding: 18px; }
    #play { width: 100%; padding: 16px; font-size: 26px; font-family: Impact,sans-serif; border: 0; border-radius: 10px; background: #ff5a4d; color: #fff; cursor: pointer; }
    #lnav { display: grid; gap: 8px; }
    #lnav button { padding: 13px; font-size: 18px; font-family: Impact,sans-serif; border-radius: 10px; border: 2px solid #5ec8ff88; background: #12303c; color: #fff; cursor: pointer; }
    #onl { position: fixed; left: 10px; bottom: 10px; z-index: 6; background: #0c1a22cc; border: 2px solid #5ec8ff55; border-radius: 10px; padding: 6px 12px; font-size: 15px; }
    #acc { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 16px; color: #9fd9ef; }
    #out { padding: 6px 10px; font-size: 13px; border: 0; border-radius: 8px; background: #ff5a4d; color: #fff; cursor: pointer; }

    /* HUD do Canvas do Jogo */
    #game { display: none; }
    #game > div { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000; }
    #top { top: 10px; left: 50%; transform: translateX(-50%); font-size: 20px; text-align: center; }
    #hpw { bottom: 20px; left: 20px; width: 240px; }
    #hpb { height: 16px; background: #0008; border-radius: 8px; overflow: hidden; border: 2px solid #fff6; }
    #hp { height: 100%; background: #4be37a; width: 100%; }
    #wp { bottom: 20px; right: 20px; font-size: 26px; font-family: Impact,sans-serif; }
    #pnl { position: fixed; inset: 0; z-index: 25; background: #000c; display: none; flex-direction: column; align-items: center; padding: 10px; gap: 8px; }
    #pnlh { display: flex; justify-content: space-between; align-items: center; width: min(640px,96vw); font: 24px Impact,sans-serif; }
    #pcl { padding: 8px 16px; font-size: 18px; border: 0; border-radius: 8px; background: #ff5a4d; color: #fff; cursor: pointer; }
    #pnlb { width: min(640px,96vw); flex: 1; overflow-y: auto; background: #0c1a22; border: 2px solid #5ec8ff55; border-radius: 12px; padding: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(105px,1fr)); gap: 8px; }
    .sk { background: #12303c; color: #fff; border: 2px solid transparent; border-radius: 10px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; }
    .sk.on { border-color: #5ec8ff; }
  </style>
</head>
<body>

  <!-- CONTÊINER PRINCIPAL -->
  <div id="game-container">
    
    <!-- TELA DE AUTENTICAÇÃO / LOGIN -->
    <div id="auth" class="overlay-screen">
      <div class="auth-box">
        <h1>ROYALE SENAI</h1>
        <p>Crie sua conta ou entre para salvar seu progresso</p>

        <div class="input-group">
          <label for="anick">NICKNAME</label>
          <input id="anick" maxlength="14" placeholder="Nick (3-14 letras)" autocomplete="username" autocapitalize="off">
        </div>

        <div class="input-group">
          <label for="apass">SENHA</label>
          <input id="apass" type="password" maxlength="64" placeholder="Sua senha" autocomplete="current-password">
        </div>

        <div class="btn-group">
          <button type="button" id="alogin" class="btn-primary">ENTRAR</button>
          <button type="button" id="areg" class="btn-secondary">CRIAR CONTA</button>
        </div>

        <div id="ast">Aguardando ação...</div>
      </div>
    </div>

    <!-- TELA DO LOBBY -->
    <div id="lobby">
      <button id="snd" style="display:none"></button>
      <div id="onl">🟢 <b id="onn">0</b> online</div>
      <div id="lbar">
        <b id="lv">NÍVEL 1</b>
        <div id="xp"><div id="xpb"></div></div>
        <span id="xpt">0/100 XP</span>
        <span id="co">🪙 0</span>
      </div>
      <h1 style="font-family:Impact;font-size:48px;letter-spacing:2px">ROYALE SENAI</h1>
      <div style="color:#9fd9ef">Você + 11 bots</div>
      
      <div id="lmain">
        <div id="pvw"><canvas id="pv"></canvas><div id="pvn"></div></div>
        <div id="lside">
          <div class="card">
            <div id="acc"><span>👤 <b id="accn">Jogador</b></span><button id="out">Sair</button></div>
            <button id="play">JOGAR</button>
            <div id="st"></div>
          </div>
          <div id="lnav">
            <button data-p="closet">👕 VESTIÁRIO</button>
            <button data-p="shop">🛒 LOJA</button>
            <button data-p="pass">⭐ PASSE ATUALIZAÇÃO</button>
          </div>
        </div>
      </div>

      <!-- PAINEL DA LOJA / VESTIÁRIO -->
      <div id="pnl">
        <div id="pnlh"><b id="pnlt"></b><button id="pcl">✕</button></div>
        <div id="pnlb"></div>
      </div>
    </div>

    <!-- HUD DO JOGO 3D -->
    <div id="game">
      <canvas id="mm" width="150" height="150"></canvas>
      <div id="top">👤 <b id="al">-</b> &nbsp; 💀 <b id="kl">0</b> &nbsp; <span id="zn"></span></div>
      <div id="scope"><b></b></div>
      <div id="bar"></div>
      <div id="feed"></div>
      <div id="msg"></div>
      <div id="elim"></div>
      <div id="cross"></div>
      <div id="dmg"></div>
      <div id="hpw"><div id="hpb"><div id="hp"></div></div></div>
      <div id="stw"><div id="stb"></div></div>
      <div id="wp"></div>
    </div>

  </div>

  <!-- DEPENDÊNCIAS DE RENDERIZAÇÃO 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- LÓGICA DE CONEXÃO COM O SERVIDOR E CONTROLES -->
  <script>
    const $ = id => document.getElementById(id);

    // Função de Autenticação com o Render
    async function authGo(path) {
      const nickInput = $('anick');
      const passInput = $('apass');
      const statusText = $('ast');

      const nick = nickInput ? nickInput.value.trim() : '';
      const password = passInput ? passInput.value : '';

      if (!nick || !password) {
        if (statusText) statusText.textContent = 'Preencha nick e senha!';
        alert('Preencha nick e senha!');
        return;
      }

      if (statusText) {
        statusText.style.color = '#58a6ff';
        statusText.textContent = 'Conectando ao servidor...';
      }

      try {
        const response = await fetch('/api/' + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nick: nick, password: password })
        });

        if (!response.ok) {
          throw new Error('Servidor respondeu com código ' + response.status);
        }

        const data = await response.json();

        if (data.token) {
          localStorage.setItem('rs_token', data.token);
        }

        // Abre o lobby e oculta a tela de autenticação
        $('auth').style.display = 'none';
        $('lobby').style.display = 'flex';
        if ($('accn')) $('accn').textContent = data.nick || nick;

      } catch (err) {
        console.error('Erro no login:', err);
        if (statusText) {
          statusText.style.color = '#ffb3a8';
          statusText.textContent = 'Erro ao conectar!';
        }
        alert('Falha na conexão com o servidor: ' + err.message);
      }
    }

    // Vincula os eventos aos botões quando o DOM carrega
    window.addEventListener('DOMContentLoaded', () => {
      const btnLogin = $('alogin');
      const btnReg = $('areg');
      const btnLogout = $('out');

      if (btnLogin) btnLogin.onclick = (e) => { e.preventDefault(); authGo('login'); };
      if (btnReg) btnReg.onclick = (e) => { e.preventDefault(); authGo('register'); };
      
      if (btnLogout) {
        btnLogout.onclick = () => {
          localStorage.removeItem('rs_token');
          $('lobby').style.display = 'none';
          $('auth').style.display = 'flex';
        };
      }
    });
  </script>
</body>
</html>
