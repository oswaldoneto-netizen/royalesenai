</style></head><body>

  <div class="card"><input id="anick" maxlength="14" placeholder="Nick (3-14, sem espaços)" autocomplete="username" autocapitalize="off"><input id="apass" type="password" maxlength="64" placeholder="Senha" autocomplete="current-password">

<script>
const $=i=>document.getElementById(i);
addEventListener('error',e=>{const a=document.getElementById('ast');if(a&&!a.textContent)a.textContent='Erro: '+e.message});
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
let jx=0,jy=0,tFire=false,tSprint=false,joyId=null,lookId=null,fireId=null,jc=[0,0],lk=[0,0],fk=[0,0];
const JR=55;
const CH=[['Recruta',0x3b6ea8,0x22324a,'cap',0x3b6ea8,0,'free','none'],['Ninja',0x1c1c22,0x111114,'band',0xd62828,400,'shop','scarf'],['Astronauta',0xe8eef2,0xaab4be,'helm',0xf4f7fa,700,'shop','tank'],['Rei Ouro',0xffc93c,0xb8902a,'crown',0xffe066,1000,'shop','cape'],['Neon',0x00d9b5,0x04594c,'cap',0x00ffd5,0,'pass','glow'],['Fogo',0xff4a1c,0x5a1a0a,'horn',0xffd1a0,0,'pass','flame'],['Lenda',0x9b5cff,0x2a1850,'crown',0xd9b8ff,0,'pass','cape'],['Criador',0x111116,0x1e1e24,'crown',0xffd700,0,'creator','cape']];
const WSK=[['Padrão',0x9aa4b2,0,'free'],['Ouro',0xffc93c,300,'shop'],['Neon',0x00ffd5,500,'shop'],['Fogo',0xff4a1c,800,'shop'],['Camuflado',0x5b7a3a,0,'pass'],['Galáxia',0x7a4bff,0,'pass'],['Diamante',0x7ee8ff,0,'pass'],['Criador',0xff2d95,0,'creator']];
const PASS=[[50,['$',100]],[60,['w',4]],[70,['c',4]],[80,['$',200]],[90,['w',5]],[100,['c',5]],[110,['$',300]],[120,['w',6]],[130,['$',400]],[150,['c',6]]],PASSP=800;
const ITN=['Pistola','Rifle','Shotgun','Sniper','Bandagem','Kit médico'],RAR=[['Incomum',0x4cd964],['Raro',0x3aa0ff],['Épico',0xb15cff],['Lendário',0xffa51f]],DM=[1,1.15,1.3,1.5];var pvUpd=null;
const WN=['Pistola','Rifle','Shotgun','Sniper'],WCD=[350,110,900,1500],WCOL=[0xdddddd,0x6b8e23,0xb5651d,0x5a5ad0,0xffffff];
let save={xp:0,coins:0,cown:[0],wown:[0],ec:0,ew:0,pass:0,cl:{},nick:'',mute:0,creator:0};
let tok='',acct=null,saveT=0;try{tok=localStorage.getItem('brt')||''}catch(e){}
function pushSave(){if(!tok)return Promise.resolve();const s=Object.assign({},save);delete s.nick;delete s.creator;return fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Token':tok},body:JSON.stringify({save:s}),keepalive:true}).catch(()=>{})}
const persist=()=>{clearTimeout(saveT);saveT=setTimeout(pushSave,400)};
addEventListener('pagehide',()=>{if(tok&&acct)pushSave()});
const lvl=()=>{let l=1,x=save.xp;while(x>=100*l&&l<150){x-=100*l;l++}return l>=150?[150,15000,15000]:[l,x,100*l]};
const hex=c=>'#'+c.toString(16).padStart(6,'0');
let panel='';
const info=(k,i)=>{const s=(k==='c'?CH:WSK)[i];return{n:s[0],col:s[1],pc:k==='c'?s[2]:s[1],price:k==='c'?s[5]:s[2],src:k==='c'?s[6]:s[3]}};
const own=(k,i)=>(k==='c'?save.cown:save.wown).includes(i);
function equip(k,i){if(k==='c')save.ec=i;else save.ew=i}
function giveItem(k,i){const a=k==='c'?save.cown:save.wown;if(!a.includes(i))a.push(i)}
function claim(kind,i){
  const [fc,pr]=PASS[i],key=kind+i;if(save.cl[key])return;
  if(kind==='f')save.coins+=fc;else{if(!save.pass)return;if(pr[0]==='$')save.coins+=pr[1];else giveItem(pr[0],pr[1])}
  save.cl[key]=1;persist();renderLobby();
}
function renderLobby(){
  const[l,x,n]=lvl();$('lv').textContent='NÍVEL '+l;$('xpb').style.width=(x/n*100)+'%';$('xpt').textContent=x+' / '+n+' XP';$('co').textContent='🪙 '+(save.creator?'∞':save.coins);
  if(pvUpd)pvUpd();
  const P=$('pnl');P.style.display=panel?'flex':'none';if(!panel)return;
  $('pnlt').textContent={closet:'VESTIÁRIO',shop:'LOJA',pass:'PASSE ATUALIZAÇÃO 1'}[panel];$('pnlt').className=panel==='pass'?'tilt':'';
  const B=$('pnlb');B.innerHTML='';
  const cat=(title,k)=>{
    const h=document.createElement('h3');h.textContent=title;B.appendChild(h);const g=document.createElement('div');g.className='grid';B.appendChild(g);
    const N=(k==='c'?CH:WSK).length;
    for(let i=0;i<N;i++){
      const f=info(k,i),o=own(k,i),eq=(k==='c'?save.ec:save.ew)===i;
      if(panel==='closet'&&!o)continue;if(panel==='shop'&&(f.src==='free'||f.src==='creator'))continue;
      const b=document.createElement('button');b.className='sk'+(eq?' on':'')+(panel==='shop'&&!o&&f.src==='pass'?' lock':'');
      const sw=k==='c'?'linear-gradient('+hex(f.col)+' 55%,'+hex(f.pc)+' 55%)':hex(f.col);
      const lb=panel==='closet'?(eq?'Equipado':'Equipar'):o?(eq?'Equipado':'Comprado'):f.src==='pass'?'🔒 Passe':'🪙 '+f.price;
      const im=k==='c'?charThumb(i):gunIcon(1,f.col);b.innerHTML='<img src="'+im+'"><span>'+f.n+'</span><small>'+lb+'</small>';
      b.onclick=()=>{if(o)equip(k,i);else if(f.src==='shop'&&save.coins>=f.price){save.coins-=f.price;giveItem(k,i);equip(k,i)}else return;persist();renderLobby()};
      g.appendChild(b);
    }
