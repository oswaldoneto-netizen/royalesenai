function resolve(p,rad,y){

    if(o.k===0){const m=o.r+rad;if(Math.abs(dx)>m||Math.abs(dz)>m)continue;const d=Math.hypot(dx,dz)||.001;if(d<m){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m}}

}
