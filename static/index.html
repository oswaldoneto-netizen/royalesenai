<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Royale Senai</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body,html{width:100%;height:100%;overflow:hidden;background:#0c1a22;color:#e9f3f7;font-family:'Trebuchet MS','Segoe UI',sans-serif}
#lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:12px 0;gap:10px;background:linear-gradient(180deg,#0c1a22 0%,#17424f 60%,#ff7a4d 140%);z-index:10}
#snd{position:fixed;top:10px;right:10px;z-index:15;font-size:22px;background:#0c1a22cc;border:2px solid #5ec8ff55;border-radius:10px;color:#fff;padding:6px 10px;cursor:pointer}
h1{font-family:Impact,sans-serif;font-size:clamp(40px,8vw,80px);letter-spacing:2px;transform:skewX(-8deg);margin-bottom:4px}
.card{background:#0c1a22cc;border:2px solid #5ec8ff55;border-radius:14px;padding:18px;width:min(560px,92vw)}
#play{width:100%;padding:16px;font-size:26px;font-family:Impact,sans-serif;letter-spacing:2px;border:0;border-radius:10px;background:#ff5a4d;color:#fff;cursor:pointer}
#play:disabled{opacity:.5;cursor:wait}
#st{min-height:22px;text-align:center;margin-top:10px;color:#9fd9ef}
#lbar{display:flex;align-items:center;gap:12px;width:min(860px,94vw);margin-top:4px}#lbar #xp{flex:1;height:10px;background:#08131a;border-radius:6px;overflow:hidden}#xpb{height:100%;background:#5ec8ff;width:0}
#lmain{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(860px,96vw)}
#pvw{position:relative;width:300px;height:380px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#2a6f86,#0c1a22);border:2px solid #5ec8ff55;overflow:hidden}
#pv{width:100%;height:100%;display:block}
#lside{display:flex;flex-direction:column;gap:12px;width:min(340px,92vw)}
#lnav{display:grid;gap:8px}
#lnav button{padding:13px;font-size:18px;font-family:Impact,sans-serif;letter-spacing:1px;border-radius:10px;border:2px solid #5ec8ff88;background:#12303c;color:#fff;cursor:pointer}
#pnl{position:fixed;inset:0;z-index:25;background:#000c;display:none;flex-direction:column;align-items:center;padding:10px;gap:8px}
#pnlh{display:flex;justify-content:space-between;align-items:center;width:min(640px,96vw);font:24px Impact,sans-serif}
#pcl{padding:8px 16px;font-size:18px;border:0;border-radius:8px;background:#ff5a4d;color:#fff;cursor:pointer}
#pnlb{width:min(640px,96vw);flex:1;overflow-y:auto;background:#0c1a22;border:2px solid #5ec8ff55;border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sk{background:#12303c;color:#fff;border:2px solid transparent;border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.sk.on{border-color:#5ec8ff;box-shadow:0 0 10px #5ec8ff88}
#game{display:none}
#game>div{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000}
#top{top:10px;left:50%;transform:translateX(-50%);font-size:20px;text-align:center}
#hpw{bottom:20px;left:20px;width:240px}#hpb{height:16px;background:#0008;border-radius:8px;overflow:hidden;border:2px solid #fff6}#hp{height:100%;background:#4be37a;width:100%}
#wp{bottom:20px;right:20px;font-size:26px;font-family:Impact,sans-serif}
#onl{position:fixed;left:10px;bottom:10px;z-index:15;background:#0c1a22cc;border:2px solid #5ec8ff55;border-radius:10px;padding:6px 12px;font-size:15px}
#acc{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:16px;color:#9fd9ef}
#out{padding:6px 10px;font-size:13px;border:0;border-radius:8px;background:#ff5a4d;color:#fff;cursor:pointer}
#auth{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#0c1a22 0%,#17424f 60%,#ff7a4d 140%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
#auth input{width:100%;padding:14px;font-size:18px;border-radius:10px;border:2px solid #5ec8ff;background:#08131a;color:#fff;margin-bottom:10px;outline:none}
.abtns{display:flex;gap:10px}.abtns button{flex:1;padding:14px 6px;font:22px Impact,sans-serif;letter-spacing:1px;border:0;border-radius:10px;color:#fff;cursor:pointer}
#alogin{background:#ff5a4d}#areg{background:#2b8a4a}
#ast{min-height:22px;text-align:center;margin-top:10px;color:#ffb3a8}
</style>
</head>
<body>

<div id="auth">
  <h1>ROYALE SENAI</h1>
  <div style="color:#9fd9ef;text-align:center">Entre com sua conta para carregar seu inventário</div>
  <div class="card" style="max-width:380px">
    <input id="anick" maxlength="14" placeholder="Nick (3-14 letras)" autocomplete="username" autocapitalize="off">
    <input id="apass" type="password" maxlength="64" placeholder="Senha" autocomplete="current-password">
    <div class="abtns">
      <button type="button" id="alogin">ENTRAR</button>
      <button type="button" id="areg">CRIAR CONTA</button>
    </div>
    <div id="ast">Aguardando ação...</div>
  </div>
</div>

<div id="lobby">
  <button id="snd">🔊</button>
  <div id="onl">🟢 <b id="onn">0</b> online</div>
  <div id="lbar"><b id="lv">NÍVEL 1</b><div id="xp"><div id="xpb"></div></div><span id="xpt"></span><span id="co"></span></div>
  <h1>ROYALE SENAI</h1>
  <div style="color:#9fd9ef">Você + 11 bots</div>
  <div id="lmain">
    <div id="pvw"><canvas id="pv"></canvas><div id="pvn"></div></div>
    <div id="lside">
      <div class="card">
        <div id="acc"><span>👤 <b id="accn">Jogador</b></span><button id="out">Sair</button></div>
        <button id="play">JOGAR</button>
        <div id="st"></div>
      </div>
      <div id="lnav">
        <button data-p="closet">👕 VESTIÁRIO</button>
        <button data-p="shop">🛒 LOJA</button>
        <button data-p="pass">⭐ PASSE</button>
      </div>
    </div>
  </div>
  <div id="pnl"><div id="pnlh"><b id="pnlt"></b><button id="pcl">✕</button></div><div id="pnlb"></div></div>
</div>

<div id="game">
  <canvas id="mm" width="150" height="150"></canvas>
  <div id="top">👤 <b id="al">-</b> &nbsp; 💀 <b id="kl">0</b></div>
  <div id="hpw"><div id="hpb"><div id="hp"></div></div></div>
  <div id="wp">Pistola</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = i => document.getElementById(i);

// Dados do Jogo e Skins
const CH = [
  ['Recruta', 0x3b6ea8, 0x22324a, 0, 'free'],
  ['Ninja', 0x1c1c22, 0x111114, 400, 'shop'],
  ['Astronauta', 0xe8eef2, 0xaab4be, 700, 'shop'],
  ['Rei Ouro', 0xffc93c, 0xb8902a, 1000, 'shop']
];
const WSK = [
  ['Padrão', 0x9aa4b2, 0, 'free'],
  ['Ouro', 0xffc93c, 300, 'shop'],
  ['Neon', 0x00ffd5, 500, 'shop']
];

let save = { xp:0, coins:500, cown:[0], wown:[0], ec:0, ew:0, nick:'Jogador' };
let panel = '';

function lvl() {
  let l = 1, x = save.xp;
  while(x >= 100*l && l < 150) { x -= 100*l; l++; }
  return [l, x, 100*l];
}

function own(k, i) { return (k === 'c' ? save.cown : save.wown).includes(i); }
function equip(k, i) { if(k === 'c') save.ec = i; else save.ew = i; }

function renderLobby() {
  const [l, x, n] = lvl();
  if($('lv')) $('lv').textContent = 'NÍVEL ' + l;
  if($('xpb')) $('xpb').style.width = (x/n*100) + '%';
  if($('xpt')) $('xpt').textContent = x + ' / ' + n + ' XP';
  if($('co')) $('co').textContent = '🪙 ' + save.coins;

  const P = $('pnl');
  if(P) P.style.display = panel ? 'flex' : 'none';
  if(!panel) return;

  $('pnlt').textContent = {closet:'VESTIÁRIO', shop:'LOJA', pass:'PASSE'}[panel];
  const B = $('pnlb');
  B.innerHTML = '';

  const cat = (title, k) => {
    const h = document.createElement('h3'); h.textContent = title; h.style.margin = '8px 0'; h.style.color = '#9fd9ef';
    B.appendChild(h);
    const g = document.createElement('div'); g.className = 'grid'; B.appendChild(g);
    
    const arr = k === 'c' ? CH : WSK;
    arr.forEach((f, i) => {
      const isOwned = own(k, i);
      const isEq = (k === 'c' ? save.ec : save.ew) === i;
      if(panel === 'closet' && !isOwned) return;
      
      const b = document.createElement('button');
      b.className = 'sk' + (isEq ? ' on' : '');
      const btnText = isEq ? 'Equipado' : isOwned ? 'Equipar' : '🪙 ' + f[3];
      b.innerHTML = '<span>' + f[0] + '</span><small>' + btnText + '</small>';
      
      b.onclick = () => {
        if(isOwned) { equip(k, i); }
        else if(save.coins >= f[3]) {
          save.coins -= f[3];
          (k === 'c' ? save.cown : save.wown).push(i);
          equip(k, i);
        }
        renderLobby();
      };
      g.appendChild(b);
    });
  };

  cat('Personagens', 'c');
  cat('Armas', 'w');
}

// Visualizador 3D Simples do Lobby
let scene, camera, renderer, cube;
function init3D() {
  const container = $('pvw');
  if(!container || renderer) return;
  
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ canvas: $('pv'), alpha: true, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);

  const geometry = new THREE.BoxGeometry(1.5, 2.5, 1);
  const material = new THREE.MeshBasicMaterial({ color: CH[save.ec][1] });
  cube = new THREE.Mesh(geometry, material);
  scene.add(cube);

  camera.position.z = 5;

  function animate() {
    requestAnimationFrame(animate);
    if(cube) {
      cube.rotation.y += 0.01;
      cube.material.color.setHex(CH[save.ec][1]);
    }
    renderer.render(scene, camera);
  }
  animate();
}

// Autenticação
async function authGo(path) {
  const n = ($('anick') ? $('anick').value : '').trim();
  const p = $('apass') ? $('apass').value : '';
  
  if(!n || !p) {
    if($('ast')) $('ast').textContent = 'Preencha o nick e a senha!';
    alert('Preencha o nick e a senha!');
    return;
  }

  if($('ast')) { $('ast').style.color = '#58a6ff'; $('ast').textContent = 'Conectando...'; }

  try {
    const res = await fetch('/api/' + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick: n, password: p })
    });
    if(!res.ok) throw new Error('Servidor retornou ' + res.status);
    const data = await res.json();
    
    save.nick = data.nick || n;
    if(data.save) save = Object.assign(save, data.save);

    $('auth').style.display = 'none';
    $('lobby').style.display = 'flex';
    if($('accn')) $('accn').textContent = save.nick;
    
    renderLobby();
    init3D();

  } catch(err) {
    if($('ast')) { $('ast').style.color = '#ffb3a8'; $('ast').textContent = 'Erro ao conectar!'; }
    alert('Erro de Conexão: ' + err.message);
  }
}

// Eventos de Navegação
window.addEventListener('DOMContentLoaded', () => {
  if($('alogin')) $('alogin').onclick = (e) => { e.preventDefault(); authGo('login'); };
  if($('areg')) $('areg').onclick = (e) => { e.preventDefault(); authGo('register'); };
  if($('out')) $('out').onclick = () => { location.reload(); };
  
  const navBtns = document.querySelectorAll('#lnav button');
  navBtns.forEach(btn => {
    btn.onclick = () => { panel = btn.getAttribute('data-p'); renderLobby(); };
  });
  if($('pcl')) $('pcl').onclick = () => { panel = ''; renderLobby(); };
  if($('play')) $('play').onclick = () => {
    $('lobby').style.display = 'none';
    $('game').style.display = 'block';
    alert('Partida iniciada com ' + save.nick + '! (Modo de jogo ativo)');
  };
});
</script>
</body>
</html>
